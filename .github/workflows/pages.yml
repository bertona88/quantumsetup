name: Deploy Infinite Techno to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate generative audio instrument
        run: npm --prefix app run check

      - name: Stage static site
        run: |
          mkdir _site
          cp \
            app/index.html \
            app/styles.css \
            app/main.js \
            app/audio-engine.js \
            app/techno-model.js \
            app/material-planner.js \
            app/emergent-form.js \
            app/generative-utils.js \
            app/trajectory-identity.js \
            app/track-dna.js \
            app/synth-genomes.js \
            app/synth-dsp.js \
            app/synth-worklet.js \
            app/taste-model.js \
            app/instrument-preview.js \
            app/signal-deck.js \
            _site/
          cp prototype/robots.txt _site/robots.txt

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
